name: Firebase Deploy — firestore:rules (phathiao-dashboard)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-rules-ai-studio
  cancel-in-progress: false

env:
  PROJECT: phathiao-dashboard
  FIREBASE_TOOLS: 15.28.1
  WIF_PROVIDER: projects/146015452197/locations/global/workloadIdentityPools/github/providers/github-oidc
  SA_EMAIL: firebase-gha-deploy@phathiao-cloud-2026.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22.23.0/24.17.0 มีบั๊ก http.Agent ทำ WIF auth พัง — pin ≥22.23.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - id: gcp_auth
        name: Authenticate (WIF -> SA, keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}
      # firebase.json ใช้ single-object "database" (named DB ai-studio-...) — v15.28.1 รองรับ
      # firebase CLI ยังไม่ใช้ ADC ตรง -> ส่ง access token จาก SA impersonation (keyless, 9 ก.ย. 69)
      - name: Export FIREBASE_TOKEN (SA impersonation)
        run: echo "FIREBASE_TOKEN=${{ steps.gcp_auth.outputs.access_token }}" >> "$GITHUB_ENV"
      - name: Deploy rules (dashboard)
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS }} deploy --only firestore:rules --project ${{ env.PROJECT }} --force
      - name: ตรวจผล (release ของ named DB เปลี่ยนจริง — lesson #25 default-DB trap)
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS }} firestore:indexes:list --project ${{ env.PROJECT }} >/dev/null 2>&1 || true
          echo "หลัง deploy: ตรวจ release ที่ console (database (default) — ดู firebase.json)"
