name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # hourly rebuild — pick up checkpoint updates

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest checkpoint from knowledge-brain
        run: |
          gh api "repos/chettana33/phathiao-knowledge-brain/contents/03_AI_Checkpoints/CHECKPOINT_LATEST.md" \
            --jq ".content" | base64 -d > content/checkpoint.md \
            || echo "# Checkpoint — ดึงไม่ได้ (เครือข่าย/ไฟล์เปลี่ยนที่)" > content/checkpoint.md
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_BRAIN_TOKEN }}

      - name: Pull latest MEMORY from knowledge-brain
        run: |
          gh api "repos/chettana33/phathiao-knowledge-brain/contents/99_Inbox/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "พี่เจ_MEMORY.md")" \
            --jq ".content" | base64 -d > content/memory.md \
            || echo "# พี่เจ_MEMORY — ดึงไม่ได้ (เครือข่าย/ไฟล์เปลี่ยนที่)" > content/memory.md
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_BRAIN_TOKEN }}

      - name: Pull public sanitizer (ด่านกรองข้อความอ่อนไหว)
        run: |
          set -euo pipefail
          mkdir -p tools
          gh api "repos/chettana33/phathiao-knowledge-brain/contents/tools/public_sanitize.py" \
            --jq ".content" | base64 -d > tools/public_sanitize.py
          test -s tools/public_sanitize.py || { echo "FAIL: ดึง sanitizer ไม่ได้/ว่าง — หยุดก่อน deploy"; exit 1; }
          python tools/public_sanitize.py --self-test
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_BRAIN_TOKEN }}

      - name: Sanitize + gate (ห้ามข้อมูลอ่อนไหวขึ้นหน้าเว็บสาธารณะ)
        run: |
          set -euo pipefail
          python tools/public_sanitize.py --in content/*.md
          python tools/public_sanitize.py --check content/*.md

      - name: Build dashboard
        run: |
          set -euo pipefail
          export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python build.py

      - name: Gate on published artifact (ด่านชั้นสุดท้าย — ตรวจไฟล์ที่จะ deploy จริง)
        run: |
          set -euo pipefail
          python tools/public_sanitize.py --check-artifact docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
