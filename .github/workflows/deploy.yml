name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # daily rebuild — pull latest checkpoint

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest checkpoint from knowledge-brain
        run: |
          gh api "repos/chettana33/phathiao-knowledge-brain/contents/03_AI_Checkpoints/CHECKPOINT_LATEST.md" \
            --jq ".content" | base64 -d > content/checkpoint.md \
            || echo "# Checkpoint — ดึงไม่ได้ (เครือข่าย/ไฟล์เปลี่ยนที่)" > content/checkpoint.md
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_BRAIN_TOKEN }}

      - name: Build dashboard
        run: python build.py
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
